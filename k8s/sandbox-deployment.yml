apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-deployment
  labels:
    name: sandbox-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sandbox

  template:
    metadata:
      labels:
        app: sandbox

    spec:
      serviceAccountName: resource-manager

      containers:
        - name: main-sandbox-container
          image: 205382053412.dkr.ecr.ap-southeast-2.amazonaws.com/sandbox:v4
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              name: main-sandbox

          resources:
            limits:
              cpu: "500m"
              memory: "400Mi"
            requests:
              cpu: "250m"
              memory: "200Mi"

          env:
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: REDIS_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: SANDBOX

          livenessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10