apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-deployment
  labels:
    name: router-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: router

  template:
    metadata:
      labels:
        app: router

    spec:
      containers:
        - image: 205382053412.dkr.ecr.ap-southeast-2.amazonaws.com/router:v4
          name: router-server

          resources:
            requests:
              cpu: "250m"
              memory: "250M"
            limits:
              cpu: "500m"
              memory: "500M"

          livenessProbe:
            httpGet:
              path: /api/status/healthz
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/status/readyz
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10

          env:
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: REDIS_URI

          ports:
            - containerPort: 3000
              name: http